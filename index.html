<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试合集 - 心理测试</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" as="image" href="assets/images/爱的解码首页.webp?v=6" type="image/webp">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo">起源研究社</a>
            <ul class="nav-links">
                <li><a href="catalog.html" class="active">测试合集</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container">
        <div class="hero fade-in" style="padding: 40px 20px;">
            <h1>心理测试合集</h1>
            <p class="subtitle">探索更多有趣内容，了解真实的自己</p>
        </div>

        <!-- 测试卡片网格 -->
        <div class="catalog-grid fade-in" id="catalog-grid">
            <!-- 爱的解码测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--love-decoding" id="current-quiz-card" onclick="navigateToLoveDecoding()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/爱的解码首页.webp?v=6">
                        <img src="assets/images/爱的解码首页.png?v=6" alt="爱的解码" loading="eager" fetchpriority="high" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3 id="card-title">你的爱表达方式是什么</h3>
                    <p id="card-desc">找到你发射和接收爱的信号</p>
                </div>
            </a>

            <!-- 未来对象类型测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--future-partner" id="future-partner-card" onclick="navigateToFuturePartner()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/未来伴侣首页.webp?v=6">
                        <img src="assets/images/未来伴侣首页.png?v=6" alt="未来对象类型" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>你的未来对象是什么类型</h3>
                    <p>探索你心目中理想伴侣的样子</p>
                </div>
            </a>
            
            <!-- 压力神秘生物测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--stress-creature" id="stress-creature-card" onclick="navigateToStressCreature()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/压力生物首页.webp?v=6">
                        <img src="assets/images/压力生物首页.png?v=6" alt="压力神秘生物" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>你的压力是哪种神秘生物</h3>
                    <p>发现你内心压力的神秘化身</p>
                </div>
            </a>
            
            <!-- 理想城市测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--perfect-city" id="perfect-city-card" onclick="navigateToPerfectCity()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/理想城市首页.webp?v=6">
                        <img src="assets/images/理想城市首页.png?v=6" alt="理想城市" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>你最适合居住的城市</h3>
                    <p>发现你的城市偏好密码</p>
                </div>
            </a>
            
            <!-- 结婚准备测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--marriage-readiness catalog-card--coming-soon" id="marriage-readiness-card" data-live="0" aria-disabled="true" onclick="navigateToMarriageReadiness()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/结婚准备首页.webp?v=1">
                        <img src="assets/images/结婚准备首页.png?v=1" alt="你适不适合结婚" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>你适不适合结婚</h3>
                    <p>探索你目前的婚姻准备状态</p>
                </div>
            </a>

            <!-- 古代官衔测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--ancient-title catalog-card--coming-soon" id="ancient-title-card" data-live="0" aria-disabled="true" onclick="navigateToAncientTitle()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/古代官衔首页.webp?v=1">
                        <img src="assets/images/古代官衔首页.png?v=1" alt="你在古代的职场官衔是什么" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>你在古代的职场官衔是什么</h3>
                    <p>发现你的古代职场基因</p>
                </div>
            </a>

            <!-- 天赋自测卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--strength-compass-test catalog-card--coming-soon" id="strength-compass-test-card" data-live="0" aria-disabled="true" onclick="navigateToStrengthCompassTest()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/天赋自测首页.webp?v=1">
                        <img src="assets/images/天赋自测首页.png?v=1" alt="测一测你的天赋" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>测一测你的天赋</h3>
                    <p>发现你最自然的能力类型</p>
                </div>
            </a>

            <!-- 依恋类型卡片 -->
            <a href="javascript:void(0)" class="catalog-card catalog-card--attachment-style catalog-card--coming-soon" id="attachment-style-card" data-live="0" aria-disabled="true" onclick="navigateToAttachmentStyle()">
                <div class="catalog-card-image">
                    <picture>
                        <source type="image/webp" srcset="assets/images/依恋类型首页.webp?v=1">
                        <img src="assets/images/依恋类型首页.png?v=1" alt="测一测你的依恋类型" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="catalog-card-content">
                    <h3>测一测你的依恋类型</h3>
                    <p>发现你在爱里的底层操作系统</p>
                </div>
            </a>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <p class="site-footer-line">
                <span class="site-footer-brand">心理测试</span> © 2026 起源研究社 Origin Lab
            </p>
            <p class="site-footer-note">
                保留所有权利 | 仅供娱乐参考，不构成专业建议
            </p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/deploy-config.js"></script>
    <script src="js/catalog-cards.js"></script>
    <script>
        async function navigateToLoveDecoding() {
            const card = document.getElementById('current-quiz-card');
            await navigateWithFallback('loveDecoding', card);
        }

        async function navigateToFuturePartner() {
            const card = document.getElementById('future-partner-card');
            await navigateWithFallback('futurePartner', card);
        }

        async function navigateToStressCreature() {
            const card = document.getElementById('stress-creature-card');
            await navigateWithFallback('stressCreature', card);
        }

        async function navigateToPerfectCity() {
            const card = document.getElementById('perfect-city-card');
            await navigateWithFallback('perfectCity', card);
        }

        async function navigateToMarriageReadiness() {
            await navigateCatalogCard('marriageReadiness', 'marriage-readiness-card');
        }

        async function navigateToAncientTitle() {
            await navigateCatalogCard('ancientTitle', 'ancient-title-card');
        }


        async function navigateToStrengthCompassTest() {
            await navigateCatalogCard('strengthCompass', 'strength-compass-test-card');
        }

        async function navigateToAttachmentStyle() {
            await navigateCatalogCard('attachmentStyle', 'attachment-style-card');
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyUIConfig();
            initCatalogComingSoonCards();
        });
    </script>
</body>
</html>
