<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试合集 - 心理测试</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo">起源研究社</a>
            <ul class="nav-links">
                <li><a href="catalog.html" class="active">测试合集</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container">
        <div class="hero fade-in" style="padding: 40px 20px;">
            <h1>心理测试合集</h1>
            <p class="subtitle">探索更多有趣内容，了解真实的自己</p>
        </div>

        <!-- 测试卡片网格 -->
        <div class="catalog-grid fade-in" id="catalog-grid">
            <!-- 爱的解码测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card" id="current-quiz-card" onclick="navigateToLoveDecoding()">
                <div class="catalog-card-image" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/爱的解码首页.png" alt="爱的解码" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="catalog-card-content">

                    <h3 id="card-title">你的爱表达方式是什么</h3>
                    <p id="card-desc">找到你发射和接收爱的信号</p>
                </div>
            </a>

            <!-- 未来对象类型测试卡片 -->
            <a href="javascript:void(0)" class="catalog-card" id="future-partner-card" onclick="navigateToFuturePartner()">
                <div class="catalog-card-image" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/未来伴侣首页.png" alt="未来对象类型" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="catalog-card-content">
                    <h3>你的未来对象是什么类型</h3>
                    <p>探索你心目中理想伴侣的样子</p>
                </div>
            </a>
            
            <!-- 更多测试卡片 -->
            <div class="catalog-card" style="cursor: default;">
                <div class="catalog-card-image" style="background: linear-gradient(135deg, #f5f5f5, #e8e8e8); display: flex; align-items: center; justify-content: center;">
                </div>
                <div class="catalog-card-content">
                    <h3 style="color: #999;">更多心理测试</h3>
                    <p style="color: #aaa;">正在筹备中，敬请期待！</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <p class="site-footer-line">
                <span class="site-footer-brand">心理测试</span> © 2026 起源研究社 Origin Lab
            </p>
            <p class="site-footer-note">
                保留所有权利 | 仅供娱乐参考，不构成专业建议
            </p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/deploy-config.js"></script>
    <script>
        async function navigateToLoveDecoding() {
            const card = document.getElementById('current-quiz-card');
            await navigateWithFallback('loveDecoding', card);
        }

        // 跳转到未来伴侣测试 - 使用部署配置模块的Fallback机制
        async function navigateToFuturePartner() {
            const card = document.getElementById('future-partner-card');
            
            // 使用部署配置模块的navigateWithFallback函数
            await navigateWithFallback('futurePartner', card);
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            applyUIConfig();
            
            // 后台预检测所有平台可用性
            preloadPlatformChecks();
            
            // 检测当前部署平台并记录日志
            const platform = detectDeployPlatform();
            console.log('[Deploy] 当前平台:', platform);
            console.log('[Deploy] 当前URL:', getCurrentDeployUrl());
            console.log('[Deploy] Cloudflare 优先主站 URL:', getPrimaryDeployUrl());
        });
    </script>
</body>
</html>
